name: baseline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      # Full history: the totals step reads the previous run's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ubuntu-latest ships pwsh preinstalled; the template's `.claude/tests/`
      # battery holds `.ps1` proofs, which the tests conftest's proof bridge runs under pwsh.
      - name: verify pwsh is on PATH
        run: pwsh -NoProfile -Command 'exit 0'

      # pytest runs every proof: the tests conftest runs each script, node, bash and PowerShell proof as one case.
      - name: install pytest
        run: python3 -m pip install pytest pytest-xdist

      - name: gen_manifest --check
        run: python3 tools/gen_manifest.py --check

      - name: audit_baseline --strict
        run: python3 tools/audit_baseline.py --strict

      # Readouts, never a budget failure: the previous run's commit is the push's `before` (the branch tip the last run
      # built) or the PR's base. The byte readout carries no budget flag and exits 0, so only a crash fails its step.
      - name: totals (code, test, prose) and their change
        run: python3 template/.claude/tools/ci_totals.py "${{ github.event.before || github.event.pull_request.base.sha }}" template/.claude/

      - name: session load readouts (bytes)
        run: python3 template/.claude/tools/load_census.py

      # `--durations=20` prints the slowest tests, so a slow test shows in its own log.
      - name: baseline-repo-root proofs
        run: python3 -m pytest -n auto -q --durations=20 tests

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ubuntu-latest ships pwsh preinstalled; the template's `.claude/tests/`
      # battery holds `.ps1` proofs, which the tests conftest's proof bridge runs under pwsh.
      - name: verify pwsh is on PATH
        run: pwsh -NoProfile -Command 'exit 0'

      # pytest runs every proof: the tests conftest runs each script, node, bash and PowerShell proof as one case.
      - name: install pytest
        run: python3 -m pip install pytest pytest-xdist

      - name: template harness battery
        run: python3 -m pytest -n auto -q --durations=20 template/.claude/tests

      # `-n auto` skips every `proof_serial` proof (it fails when another proof shares the machine); this pass runs
      # them alone. A folder with none passes.
      - name: template serial proofs
        run: python3 -m pytest -p no:xdist -q --harness-serial template/.claude/tests

  # The template battery runs the full godot layer, so it cannot prove a non-godot consumer.
  # Each profile lane bootstraps a scratch project at one layer list and runs that project's own
  # battery. A proof that reaches a member the profile does not install fails the lane.
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ubuntu-latest ships pwsh preinstalled; the template's `.claude/tests/`
      # battery holds `.ps1` proofs, which the tests conftest's proof bridge runs under pwsh.
      - name: verify pwsh is on PATH
        run: pwsh -NoProfile -Command 'exit 0'

      # pytest runs every proof: the tests conftest runs each script, node, bash and PowerShell proof as one case.
      - name: install pytest
        run: python3 -m pip install pytest pytest-xdist

      - name: pure profile battery
        run: |
          set -euo pipefail
          target="$(mktemp -d)/ProfileProbe-pure"
          bash bootstrap.sh --target "$target" --project-name ProfileProbe --layers pure
          cd "$target" && python3 -m pytest -n auto -q --durations=20 .claude/tests
          python3 -m pytest -p no:xdist -q --harness-serial .claude/tests

  pure-coding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ubuntu-latest ships pwsh preinstalled; the template's `.claude/tests/`
      # battery holds `.ps1` proofs, which the tests conftest's proof bridge runs under pwsh.
      - name: verify pwsh is on PATH
        run: pwsh -NoProfile -Command 'exit 0'

      # pytest runs every proof: the tests conftest runs each script, node, bash and PowerShell proof as one case.
      - name: install pytest
        run: python3 -m pip install pytest pytest-xdist

      - name: pure,coding profile battery
        run: |
          set -euo pipefail
          target="$(mktemp -d)/ProfileProbe-pure-coding"
          bash bootstrap.sh --target "$target" --project-name ProfileProbe --layers pure,coding
          cd "$target" && python3 -m pytest -n auto -q --durations=20 .claude/tests
          python3 -m pytest -p no:xdist -q --harness-serial .claude/tests

  pure-coding-godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ubuntu-latest ships pwsh preinstalled; the template's `.claude/tests/`
      # battery holds `.ps1` proofs, which the tests conftest's proof bridge runs under pwsh.
      - name: verify pwsh is on PATH
        run: pwsh -NoProfile -Command 'exit 0'

      # pytest runs every proof: the tests conftest runs each script, node, bash and PowerShell proof as one case.
      - name: install pytest
        run: python3 -m pip install pytest pytest-xdist

      - name: pure,coding,godot profile battery
        run: |
          set -euo pipefail
          target="$(mktemp -d)/ProfileProbe-pure-coding-godot"
          bash bootstrap.sh --target "$target" --project-name ProfileProbe --layers pure,coding,godot
          cd "$target" && python3 -m pytest -n auto -q --durations=20 .claude/tests
          python3 -m pytest -p no:xdist -q --harness-serial .claude/tests

  # The ruleset requires the status context `baseline`: this job keeps that name and goes red when any lane does.
  baseline:
    name: baseline
    needs: [root, template, pure, pure-coding, pure-coding-godot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every lane succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "lane result: $r"; exit 1; }
          done
