name: baseline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ubuntu-latest ships pwsh preinstalled; the template's `.claude/tests/`
      # battery discovers `.ps1` proofs, so the harness runner below needs it on PATH.
      - name: verify pwsh is on PATH
        run: pwsh -NoProfile -Command 'exit 0'

      # The runner executes pytest-style proofs with `python -m pytest`.
      - name: install pytest
        run: python3 -m pip install pytest

      - name: gen_manifest --check
        run: python3 tools/gen_manifest.py --check

      - name: audit_baseline --strict
        run: python3 tools/audit_baseline.py --strict

      - name: baseline-repo-root proofs
        run: |
          set -e
          shopt -s nullglob
          for f in tests/test_*.py; do
            echo "== $f =="
            python3 "$f"
          done

      - name: template harness battery
        run: python3 template/.claude/scripts/harness_tests.py

      # The template battery above runs the full godot layer, so it cannot prove a non-godot consumer.
      # Each step bootstraps a scratch project at one non-godot profile and runs that project's own
      # battery. A proof that reaches a member the profile does not install fails the step.
      - name: pure profile battery
        run: |
          set -euo pipefail
          target="$(mktemp -d)/ProfileProbe-pure"
          bash bootstrap.sh --target "$target" --project-name ProfileProbe --layers pure
          cd "$target" && python3 .claude/scripts/harness_tests.py

      - name: pure,coding profile battery
        run: |
          set -euo pipefail
          target="$(mktemp -d)/ProfileProbe-pure-coding"
          bash bootstrap.sh --target "$target" --project-name ProfileProbe --layers pure,coding
          cd "$target" && python3 .claude/scripts/harness_tests.py
