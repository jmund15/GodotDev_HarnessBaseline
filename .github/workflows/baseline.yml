name: baseline

on:
  push:
  pull_request:

jobs:
  # The ruleset requires the status context `baseline`, so the one job keeps that name.
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      # Full history: the totals step reads the previous run's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python -m pip install pytest pytest-xdist

      # The previous run's commit is the push's `before` (the branch tip the last run built) or the PR's base.
      - name: totals (code, test, prose) and their change
        run: python tools/ci_totals.py "${{ github.event.before || github.event.pull_request.base.sha }}"

      # `--durations=20` prints the slowest tests, so a slow test shows in its own log (K2).
      - name: tests
        run: python -m pytest -n auto -q --durations=20 tests template/.claude/tests
